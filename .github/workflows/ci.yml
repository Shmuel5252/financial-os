name: Phase verification

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: financial-os-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mongo:
        image: mongo:8.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'quit(db.adminCommand({ping:1}).ok ? 0 : 1)'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      MONGODB_TEST_URI: mongodb://127.0.0.1:27017
      # Single-node replica set for the deletion ledger, snapshot capture and restore/release-fence rehearsals.
      MONGODB_TEST_REPLICA_URI: mongodb://127.0.0.1:27018
      MONGODB_TEST_DB_NAME: financial_os_ci
      RUN_REAL_ANTHROPIC_TESTS: "0"
      RUN_REAL_RESEND_TESTS: "0"
      RUN_REAL_OPEN_FINANCE_TESTS: "0"
      RUN_REAL_OPEN_FINANCE_RECONNECTION_TESTS: "0"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Audit production and development dependencies
        run: npm audit --audit-level=high

      - name: Reject private artifacts and known secret signatures
        run: npm run security:check

      - name: Verify source index inventory
        run: npm run operations:index-check

      - name: Start single-node replica set for recovery rehearsals
        run: |
          docker run -d --name mongo-rs --network host mongo:8.0 --replSet rs0 --port 27018 --bind_ip 127.0.0.1
          for i in $(seq 1 30); do docker exec mongo-rs mongosh --quiet --port 27018 --eval 'db.adminCommand({ ping: 1 })' && break; sleep 1; done
          docker exec mongo-rs mongosh --quiet --port 27018 --eval 'rs.initiate({ _id: "rs0", members: [{ _id: 0, host: "127.0.0.1:27018" }] })'
          for i in $(seq 1 30); do docker exec mongo-rs mongosh --quiet --port 27018 --eval 'quit(db.hello().isWritablePrimary ? 0 : 1)' && break; sleep 1; done
          docker exec mongo-rs mongosh --quiet --port 27018 --eval 'quit(db.hello().isWritablePrimary ? 0 : 1)'

      - name: Run unit and available integration tests
        run: npm test

      - name: Run strict type-check
        run: npm run typecheck

      - name: Run zero-warning lint
        run: npm run lint

      - name: Build production application
        run: npm run build
