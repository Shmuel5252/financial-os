name: Phase verification

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: financial-os-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Audit production and development dependencies
        run: npm audit --audit-level=high

      - name: Run unit and available integration tests
        run: npm test

      - name: Run strict type-check
        run: npm run typecheck

      - name: Run zero-warning lint
        run: npm run lint

      - name: Build production application
        run: npm run build
