name: Phase verification

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: financial-os-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mongo:
        image: mongo:8.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'quit(db.adminCommand({ping:1}).ok ? 0 : 1)'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      MONGODB_TEST_URI: mongodb://127.0.0.1:27017
      # Single-node replica set for the deletion ledger, snapshot capture and restore/release-fence rehearsals.
      MONGODB_TEST_REPLICA_URI: mongodb://127.0.0.1:27018
      MONGODB_TEST_DB_NAME: financial_os_ci
      RUN_REAL_ANTHROPIC_TESTS: "0"
      RUN_REAL_RESEND_TESTS: "0"
      RUN_REAL_OPEN_FINANCE_TESTS: "0"
      RUN_REAL_OPEN_FINANCE_RECONNECTION_TESTS: "0"

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Audit production and development dependencies
        run: npm audit --audit-level=high

      - name: Reject private artifacts and known secret signatures
        run: npm run security:check

      - name: Verify source index inventory
        run: npm run operations:index-check

      - name: Validate the CloudFormation template against AWS resource schemas
        run: |
          python3 -m pip install --quiet cfn-lint==1.57.1
          cfn-lint --regions eu-central-1 -- infra/aws/financial-os-backup.template.json

      - name: Start single-node replica set for recovery rehearsals
        run: |
          docker run -d --name mongo-rs --network host mongo:8.0 --replSet rs0 --port 27018 --bind_ip 127.0.0.1
          for i in $(seq 1 30); do docker exec mongo-rs mongosh --quiet --port 27018 --eval 'db.adminCommand({ ping: 1 })' && break; sleep 1; done
          docker exec mongo-rs mongosh --quiet --port 27018 --eval 'rs.initiate({ _id: "rs0", members: [{ _id: 0, host: "127.0.0.1:27018" }] })'
          for i in $(seq 1 30); do docker exec mongo-rs mongosh --quiet --port 27018 --eval 'quit(db.hello().isWritablePrimary ? 0 : 1)' && break; sleep 1; done
          docker exec mongo-rs mongosh --quiet --port 27018 --eval 'quit(db.hello().isWritablePrimary ? 0 : 1)'

      - name: Start authenticated single-node replica set for least-privilege checks
        run: |
          ADMIN_PASSWORD=$(head -c 32 /dev/urandom | base64 | tr -dc 'A-Za-z0-9' | head -c 24)
          echo "::add-mask::$ADMIN_PASSWORD"
          docker run -d --name mongo-auth --network host --entrypoint bash mongo:8.0 -c 'head -c 756 /dev/urandom | base64 -w0 > /tmp/keyfile && chmod 400 /tmp/keyfile && exec mongod --replSet rsa --port 27019 --bind_ip 127.0.0.1 --auth --keyFile /tmp/keyfile'
          for i in $(seq 1 30); do docker exec mongo-auth mongosh --quiet --port 27019 --eval 'db.adminCommand({ ping: 1 })' && break; sleep 1; done
          docker exec mongo-auth mongosh --quiet --port 27019 --eval 'rs.initiate({ _id: "rsa", members: [{ _id: 0, host: "127.0.0.1:27019" }] })'
          for i in $(seq 1 30); do docker exec mongo-auth mongosh --quiet --port 27019 --eval 'quit(db.hello().isWritablePrimary ? 0 : 1)' && break; sleep 1; done
          docker exec mongo-auth mongosh --quiet --port 27019 --eval "db.getSiblingDB('admin').createUser({ user: 'ci-admin', pwd: '$ADMIN_PASSWORD', roles: ['root'] })"
          echo "MONGODB_TEST_AUTH_REPLICA_URI=mongodb://ci-admin:$ADMIN_PASSWORD@127.0.0.1:27019/?authSource=admin&directConnection=true" >> "$GITHUB_ENV"

      - name: Run unit and available integration tests
        run: npm test

      - name: Run strict type-check
        run: npm run typecheck

      - name: Run zero-warning lint
        run: npm run lint

      - name: Build production application
        run: npm run build

      - name: Build backup worker and restore-drill bundles
        run: npm run workers:build

      - name: Smoke-test worker bundles fail closed without configuration
        run: |
          node --input-type=module -e "const m = await import('./.build/backup-worker/index.mjs'); if (typeof m.handler !== 'function') process.exit(1); try { await m.handler(); process.exit(1); } catch (e) { if (!/failed closed/.test(e.message)) process.exit(1); }"
          env -u FINANCIAL_OS_ENVIRONMENT node .build/restore-drill/index.mjs --store /nonexistent 2>&1 | grep -q "FINANCIAL_OS_ENVIRONMENT missing"
          env -u FINANCIAL_OS_ENVIRONMENT node .build/ledger-rebuild/index.mjs --store /nonexistent 2>&1 | grep -q "FINANCIAL_OS_ENVIRONMENT missing"
