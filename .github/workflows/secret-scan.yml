name: Secret scan

# Phase 18 row 18-16: secret scanning of the FULL git history with gitleaks (release binary pinned by version and SHA-256).
# The self-test runs the same `gitleaks git` mode and flags as the real scan against a throwaway one-commit repository holding
# a synthetic token, so a broken or always-passing scanner cannot pass. Inline `gitleaks:allow` comments are ignored, a
# repository `.gitleaks.toml` (which gitleaks would load silently) and a shallow checkout both fail the job, and only the
# exact fingerprints in `.gitleaksignore` are excused. Findings are reported redacted as rule, file:line and commit only.
on:
  push:
    branches: [main]
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the full history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks 8.30.1 (checksum-verified)
        run: |
          curl -sSfL -o "$RUNNER_TEMP/gitleaks.tar.gz" https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" version

      - name: Guard the scan configuration
        run: |
          if [ -e .gitleaks.toml ]; then echo "::error title=gitleaks guard::.gitleaks.toml would silently replace the default rules - review it explicitly"; exit 1; fi
          if [ "$(git rev-parse --is-shallow-repository)" != "false" ]; then echo "::error title=gitleaks guard::shallow checkout - history would be incomplete"; exit 1; fi
          echo "guard: default rules, full history ($(git rev-list --count --all) commits)"

      - name: Self-test - a synthetic secret committed to a throwaway repository must be detected
        run: |
          canary="$(mktemp -d)"
          git -C "$canary" init -q
          # Assembled at run time so this repository never contains the pattern; random, so it is never a real credential.
          printf 'GITHUB_TOKEN=%s%s\n' 'ghp_' "$(head -c 64 /dev/urandom | base64 | tr -dc 'A-Za-z0-9' | head -c 36)" > "$canary/config.env"
          git -C "$canary" add config.env
          git -C "$canary" -c user.name=canary -c user.email=canary@example.invalid commit -q -m canary
          set +e
          "$RUNNER_TEMP/gitleaks" git "$canary" --no-banner --redact --ignore-gitleaks-allow --exit-code 42 > /dev/null 2>&1
          code=$?
          set -e
          rm -rf "$canary"
          if [ "$code" -ne 42 ]; then echo "::error title=gitleaks self-test::the scanner did not detect the synthetic secret (exit $code)"; exit 1; fi
          echo "self-test: synthetic secret detected in git mode (exit $code)"

      - name: Scan the full git history
        run: |
          set +e
          "$RUNNER_TEMP/gitleaks" git . --no-banner --redact --ignore-gitleaks-allow --exit-code 1 \
            --report-format json --report-path "$RUNNER_TEMP/gitleaks.json" > /dev/null 2> "$RUNNER_TEMP/gitleaks.log"
          code=$?
          set -e
          echo "$code" > "$RUNNER_TEMP/gitleaks.exit"
          # gitleaks' own log (redacted; without --verbose it never contains finding contents).
          cat "$RUNNER_TEMP/gitleaks.log"
          exit "$code"

      - name: Publish a redacted result summary
        if: always()
        run: |
          python3 - <<'PY'
          import json, os, subprocess
          temp = os.environ["RUNNER_TEMP"]
          escape = lambda s: str(s).replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
          path, exit_path = os.path.join(temp, "gitleaks.json"), os.path.join(temp, "gitleaks.exit")
          code = open(exit_path).read().strip() if os.path.exists(exit_path) else "not run"
          commits = subprocess.run(["git", "rev-list", "--count", "--all"], capture_output=True, text=True).stdout.strip()
          findings = json.load(open(path)) if os.path.exists(path) else None
          if findings is None:
              print(f"::warning title=gitleaks summary::no report produced (scan exit {escape(code)})")
          else:
              rows = sorted(escape(f'{f["RuleID"]} | {f["File"]}:{f["StartLine"]} | commit {f["Commit"][:10]}') for f in findings)
              print(f"::notice title=gitleaks summary::{len(rows)} finding(s) across {commits} commits; scan exit {escape(code)}" + "".join("%0A" + r for r in rows))
          PY
