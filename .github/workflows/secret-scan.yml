name: Secret scan

# Phase 18 row 18-16: secret scanning of the FULL git history with gitleaks (release binary pinned by version and SHA-256).
# A self-test first proves the scanner detects a synthetic secret, so a silently broken scanner cannot pass. Findings are
# reported redacted as rule, file:line and commit only; no secret value is ever printed.
on:
  push:
    branches: [main]
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the full history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks 8.30.1 (checksum-verified)
        run: |
          curl -sSfL -o "$RUNNER_TEMP/gitleaks.tar.gz" https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" version

      - name: Self-test - a synthetic secret must be detected
        run: |
          canary="$(mktemp -d)"
          # Assembled at run time so this repository never contains the pattern; random, so it is never a real credential.
          printf 'GITHUB_TOKEN=%s%s\n' 'ghp_' "$(head -c 64 /dev/urandom | base64 | tr -dc 'A-Za-z0-9' | head -c 36)" > "$canary/config.env"
          set +e
          "$RUNNER_TEMP/gitleaks" dir "$canary" --no-banner --redact --exit-code 42 > /dev/null 2>&1
          code=$?
          set -e
          rm -rf "$canary"
          if [ "$code" -ne 42 ]; then echo "::error title=gitleaks self-test::the scanner did not detect the synthetic secret (exit $code)"; exit 1; fi
          echo "self-test: synthetic secret detected (exit $code)"

      - name: Scan the full git history
        run: |
          "$RUNNER_TEMP/gitleaks" git . --no-banner --redact --exit-code 1 \
            --report-format json --report-path "$RUNNER_TEMP/gitleaks.json" > /dev/null 2>&1

      - name: Publish a redacted result summary
        if: always()
        run: |
          python3 - <<'PY'
          import json, os, subprocess
          path = os.path.join(os.environ["RUNNER_TEMP"], "gitleaks.json")
          findings = json.load(open(path)) if os.path.exists(path) else None
          commits = subprocess.run(["git", "rev-list", "--count", "HEAD"], capture_output=True, text=True).stdout.strip()
          if findings is None:
              print("::warning title=gitleaks summary::no report produced")
          else:
              rows = sorted(f'{f["RuleID"]} | {f["File"]}:{f["StartLine"]} | commit {f["Commit"][:10]}' for f in findings)
              print(f"::notice title=gitleaks summary::{len(rows)} finding(s) across {commits} commits" + "".join("%0A" + r for r in rows))
          PY
